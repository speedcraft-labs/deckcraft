[package]
name = "deckcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft on the command line: render, convert, run commands, inspect, and serve MCP"
publish = false

[lints]
workspace = true

[[bin]]
name = "deckcraft-cli"
path = "src/main.rs"

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-mcp = { workspace = true }
deckcraft-ui-egui = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "0.4"
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
zip = { workspace = true }
